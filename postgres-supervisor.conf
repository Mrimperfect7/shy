[program:postgres]
command=/usr/lib/postgresql/15/bin/postgres -D /app/postgres-data -c listen_addresses=localhost -c unix_socket_directories=/var/run/postgresql
user=postgres
autostart=true
autorestart=true
priority=1
stdout_logfile=/var/log/supervisor/postgres.out.log
stderr_logfile=/var/log/supervisor/postgres.err.log
